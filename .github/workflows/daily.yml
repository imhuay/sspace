name: daily

on:
  workflow_dispatch: # for manual workflow trigger
  # schedule:
  #   # Setting it to 00:00 may cause a huge delay, probably because lots of tasks are being executed at that point.
  #   - cron: '0 17 * * *' # runs at every 01:00 BeiJing Time
  push:
    branches: [ 'master' ]
    paths:
      - '.github/workflows/daily.yml'
      - 'README.md'
      - 'notes/**'
      - 'algorithms/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须 0, 否则无法获取所有历史提交信息 (脚本中有依赖)

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '>=3.12'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv markdown
          uv pip install -e . --system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install nodejs dependencies
        run: |
          npm install mathjax-full

      # 缓存 TeX Live 安装目录 (固定 key) 
      # - name: Cache TeX Live
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.texlive
      #       ~/.texlive2025
      #     key: texlive-${{ runner.os }}-v1

      - name: Install full TeX Live
        uses: TeX-Live/setup-texlive-action@v3  # 自带 cache
        with:
          packages: scheme-full
      
      - name: Update README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python scripts/readme/main.py
          git add -u
          git add notes/**/*.tex
          git add notes/**/*.svg
          # git commit -m 'Auto-Update README'
          # git push

      # - name: Test TeX environment
      #   run: |
      #     (
      #       cd examples/tex-live \
      #         && latex -output-format=dvi demo.tex \
      #         && dvisvgm --no-fonts --bbox=preview --scale=1.0 -o demo.svg demo.dvi \
      #         && git add demo.svg \
      #         && git commit -m 'Auto-Update demo.svg' || echo "No changes to commit." \
      #         && git push
      #     )

      - name: Convert all .tex to .svg (recursive, not .js.tex)
        run: |
          set -euo pipefail
          find notes/ -name '*.tex' ! -name '*.js.tex' | while read -r texfile; do
            dir=$(dirname "$texfile")
            base=$(basename "$texfile" .tex)
            echo "Processing $texfile ..."
            latex -output-format=dvi -output-directory="$dir" "$texfile"
            dvisvgm --no-fonts --bbox=preview --scale=1.0 -o "$dir/$base.svg" "$dir/$base.dvi"
          done
          git add notes/**/*.tex

      - name: Push
        run: |
          # git config --global user.name "github-actions[bot]"
          # git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-Update README"
            git push
          fi